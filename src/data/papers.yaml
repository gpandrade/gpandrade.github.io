- id: who-aggregates-information
  title: "Who Aggregates Information? Screening, Rent, and the Coexistence of CLOB and AMM Prediction Markets"
  authors: [Chengqi Zang, Gabriel P. Andrade, Tomoyuki Nakajima]
  year: 2026
  date: 2026-09
  venue: arXiv preprint; CIRJE discussion paper
  arxiv: "2609.20017"
  pdf: https://www.cirje.e.u-tokyo.ac.jp/research/dp/2026/2026cf1277.pdf
  summary: >-
    Order-book market makers in prediction markets do not earn from spreads but from
    carrying the under-priced side of behavioural tail demand to settlement, which
    screens informed traders out of the order-book and towards any coexisting automated market maker.
  selected: true

- id: credibly-neutral-oracles
  title: Manipulation-Resistant AI Oracles via Credible Neutrality
  authors: [Mary Monroe, Gabriel P. Andrade, Rafael Frongillo, Bo Waggoner]
  year: 2026
  date: 2026-07
  venue: Poster at the Game Theory and Mechanism Design with LLMs workshop, ACM EC 2026
  pdf: https://blog.gensyn.ai/content/files/2026/08/Manipulation-Resistant-AI-Oracles-via-Credible-Neutrality.pdf
  links:
    - { label: Blog post, url: https://www.gensyn.ai/research/credibly-neutral-ai-oracles }
    - { label: Workshop, url: https://llm-incentives.com/ }
  summary: >-
    If the first-pass report in a dispute-based oracle is credibly neutral and
    accurate, the vote needed to overturn it can be raised and manipulation
    becomes provably harder; without neutrality, no threshold does better
    than a coin flip.
  selected: true

- id: evidence-markets
  title: Evidence Markets
  authors: [Safwan Hossain, Gabriel Andrade, Chengqi Zang, Yiling Chen]
  year: 2026
  date: 2026-06
  venue: arXiv preprint; poster at the Game Theory and Mechanism Design with LLMs workshop, ACM EC 2026
  arxiv: "2606.07434"
  links:
    - { label: Blog post, url: https://www.gensyn.ai/research/markets-that-explain-themselves }
  summary: >-
    A generalization of prediction markets that pays traders for evidence as
    well as forecasts, and can resolve on the accumulated evidence when no
    external ground truth exists.
  selected: true

- id: perishable-utility-markets
  title: Two-Sided Market Design for Goods with Perishable Utility
  authors: [Chengqi Zang, Gabriel P. Andrade]
  year: 2025
  date: 2025-11
  venue: arXiv preprint
  arxiv: "2511.16357"
  summary: >-
    A two-sided market for goods that lose their value if unused, such as
    compute: a load-based posted price handles price discovery and a greedy
    second-price matching rule handles allocation, keeping providers truthful
    at a tight competitive ratio.
    A two-sided market design for goods that lose their value if unused, such as compute.
    We use a load-based posted price to handle price discovery and a greedy second-price 
    matching rule to handle allocations, so providers are kept truthful.

- id: sapo
  title: "Sharing is Caring: Efficient LM Post-Training with Collective RL Experience Sharing"
  authors: [Jeffrey Amico, Gabriel Passamani Andrade, John Donaghy, Ben Fielding, Tristin Forbus, Harry Grieve, Semih Kara, Jari Kolehmainen, Yihua Lou, Christopher Nies, Edward Phillip Flores Nuño, Diogo Ortega, Shikhar Rastogi, Austin Virts, Matthew J. Wright]
  year: 2025
  date: 2025-09
  venue: arXiv preprint
  arxiv: "2509.08721"
  links:
    - { label: Blog post, url: https://www.gensyn.ai/research/sapo-efficient-lm-post-training-with-collective-rl }
  summary: >-
    A fully decentralised, asynchronous algorithm for post-training language
    models with reinforcement learning, in which heterogeneous nodes share
    rollouts rather than weights so that useful behaviour spreads across the
    network.

- id: hdee
  title: "HDEE: Heterogeneous Domain Expert Ensemble"
  authors: [Oğuzhan Ersoy, Jari Kolehmainen, Gabriel Passamani Andrade]
  year: 2025
  date: 2025-02
  venue: Modular, Collaborative and Decentralized Deep Learning workshop, ICLR 2025
  arxiv: "2502.19385"
  links:
    - { label: Blog post, url: https://www.gensyn.ai/research/diverse-expert-ensembles-embarrassingly-parallel-llms-from-diverse-experts }
  summary: >-
    Ensembles of small domain-expert language models trained in parallel do
    better when the experts differ in size and training time to suit their
    domain, beating homogeneous ensembles on 20 of 21 domains at the same
    compute budget.

- id: no-regret-turing-complete
  title: No-Regret Learning in Games is Turing Complete
  authors: [Gabriel P. Andrade, Rafael Frongillo, Georgios Piliouras]
  year: 2023
  date: 2023-07
  venue: ACM EC 2023
  arxiv: "2202.11871"
  summary: >-
    Replicator dynamics in matrix games can simulate any Turing machine, so
    basic questions about where learning in a game ends up are undecidable.
  selected: true

- id: phd-thesis
  title: "Dynamical and Graphical Perspectives on Multi-Agent Economic Systems: Chaos, Complexity, and Universality of Learning Behaviours"
  authors: [Gabriel Passamani Andrade]
  year: 2022
  venue: PhD thesis, University of Colorado Boulder
  links:
    - { label: CU Scholar, url: https://scholar.colorado.edu/concern/graduate_thesis_or_dissertations/dv13zv493 }
  summary: >-
    Tools for understanding multi-agent economic systems away from equilibrium:
    learning in games is shown to be universal from the viewpoints of both
    dynamical systems and computability, alongside graphical models of exchange
    and algorithms by which decentralised agents reach approximate equilibria.

- id: electricity-market-dynamics
  title: "Electricity Market Dynamics as Smooth Games: Organizing Gradient-Based Learners and Identifying Instabilities"
  authors: [Gabriel P. Andrade, Braden C. Soper, Ryan A. Goldhahn]
  year: 2021
  date: 2021-07-20
  venue: LLNL technical report
  doi: 10.2172/1890814
  pdf: https://www.osti.gov/servlets/purl/1890814
  summary: >-
    Electricity markets modelled as smooth games whose consumers are
    gradient-based learners, with examples of how instabilities arise even
    under reasonable local objectives and conditions under which local Nash
    equilibria are stable fixed points of the dynamics.

